<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán - Ave Blessings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="logo">Ave Blessings</div>
  <nav class="nav">
    <a href="/">ホーム</a>
    <a href="/products">すべての商品</a>
    <a href="/cart">カート</a>
    <a href="admin.html">管理</a>
  </nav>
</header>

<main class="page-shell">
  <div class="page-header">
    <div>
      <p class="hero-label">Checkout</p>
      <h1>Thanh toán</h1>
    </div>
    <a href="/cart" class="btn-secondary">Quay lại giỏ hàng</a>
  </div>

  <div class="checkout-layout">
    <section class="section-card checkout-card">
      <form id="checkoutForm" class="checkout-form">
        <div class="form-grid">
          <label class="form-field">
            <span>Họ và tên</span>
            <input id="fullName" type="text" placeholder="Nguyễn Văn A" required />
          </label>
          <label class="form-field">
            <span>Email</span>
            <input id="email" type="email" placeholder="name@example.com" required />
          </label>
        </div>

        <div class="form-grid">
          <label class="form-field">
            <span>Điện thoại</span>
            <input type="tel" placeholder="0901 234 567" />
          </label>
          <label class="form-field">
            <span>Phương thức thanh toán</span>
            <select>
              <option>Thanh toán khi nhận hàng</option>
              <option>Chuyển khoản ngân hàng</option>
              <option>Ví điện tử</option>
            </select>
          </label>
        </div>

        <label class="form-field">
          <span>Địa chỉ giao hàng</span>
          <textarea placeholder="Số nhà, đường, quận, thành phố..."></textarea>
        </label>

        <label class="form-field">
          <span>Ghi chú</span>
          <textarea placeholder="Gửi lời nhắn hoặc yêu cầu đặc biệt..."></textarea>
        </label>

        <button type="submit" class="btn-primary full-width">Xác nhận đặt hàng</button>
      </form>
    </section>

    <aside class="section-card summary-card">
      <h3>Đơn hàng của bạn</h3>
      <div id="checkoutSummary" class="summary-list"></div>
      <div class="summary-list">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="checkoutSubtotal">¥0</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span id="checkoutShipping">¥0</span>
        </div>
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="checkoutTotal">¥0</span>
        </div>
      </div>
    </aside>
  </div>
</main>

<footer class="footer">
  <p>Ave Blessings. 電子カードとお祝い動画の販売サイト。</p>
</footer>

<script type="module" src="checkout.js"></script>
</body>
</html>
