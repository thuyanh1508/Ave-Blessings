<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Ave Blessings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="logo">Ave Blessings</div>
  <nav class="nav">
    <a href="index.html">ホーム</a>
    <a href="products.html">すべての商品</a>
    <a href="cart.html">カート</a>
    <a href="admin.html">管理</a>
  </nav>
</header>

<main class="page-shell">
  <div class="page-header">
    <div>
      <p class="hero-label">Dashboard</p>
      <h1>Quản lý mẫu thiết kế</h1>
    </div>
    <a href="products.html" class="btn-primary">Xem storefront</a>
  </div>

  <div id="stats" class="admin-grid"></div>

  <section class="section-card admin-panel" style="margin-top: 24px;">
    <h2>Đơn hàng gần đây</h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Khách hàng</th>
            <th>Sản phẩm</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </div>
  </section>

  <section class="section-card admin-panel" style="margin-top: 24px;">
    <h2>Tồn kho</h2>
    <div id="inventoryList" class="summary-list"></div>
  </section>
</main>

<footer class="footer">
  <p>© <span id="currentYear"></span> Ave Blessings. All rights reserved.</p>
</footer>

<script type="module" src="admin.js"></script>
</body>
</html>
