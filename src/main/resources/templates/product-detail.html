<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品詳細 - Ave Blessings</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/product-detail.css}" />
</head>
<body>

<header class="header">
  <div class="logo">Ave Blessings</div>
  <nav class="nav">
    <a th:href="@{/}">ホーム</a>
    <a th:href="@{/products}">すべての商品</a>
    <a href="#">誕生日</a>
    <a href="#">結婚式</a>
    <a href="#">動画ギフト</a>
    <a href="cart.html">カート</a>
  </nav>
</header>

<div class="detail-container">
  <div class="breadcrumb">
    <a th:href="@{/}">ホーム</a> /
    <a th:href="@{/products} ">すべての商品</a> /
    <span id="breadcrumbTitle">商品詳細</span>
  </div>

  <div id="detailContent">
    <!-- 商品詳細はJavaScriptで動的に生成されます -->
  </div>

  <div id="notFound" class="hidden">
    <div class="not-found">
      <h1>申し訳ございません</h1>
      <p>ご指定の商品が見つかりません。</p>
      <a th:href="@{/products}">商品一覧に戻る</a>
    </div>
  </div>
</div>

<footer class="footer">
  <p>Ave Blessings. 電子カードとお祝い動画の販売サイト。</p>
</footer>

<script type="module" th:src="@{/js/product-detail.js}"></script>

</html>
