<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>すべての商品 - Ave Blessings</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/products.css}" />
  
</head>
<body>

<header class="header">
  <div class="logo">Ave Blessings</div>
  <nav class="nav">
    <a th:href="@{/}">ホーム</a>
    <a th:href="@{/products}">すべての商品</a>
    <a th:href="@{/products(category='card')}">誕生日</a>
    <a th:href="@{/products(category='invitation')}">結婚式</a>
    <a th:href="@{/products(category='video')}">動画ギフト</a>
    <a th:href="@{/cart}">カート</a>
  </nav>
</header>

<div class="products-container">
  <div class="products-header">
    <h1>すべての商品</h1>
    <div class="filter-group">
      <input type="text" id="searchInput" placeholder="テンプレートを検索..." />
      <select id="categoryFilter">
        <option value="" th:selected="${selectedCategory == ''}">すべてのカテゴリ</option>
        <option value="card" th:selected="${selectedCategory == 'card'}">電子カード</option>
        <option value="invitation" th:selected="${selectedCategory == 'invitation'}">招待状</option>
        <option value="video" th:selected="${selectedCategory == 'video'}">動画ギフト</option>
      </select>
      <select id="priceFilter">
        <option value="">価格</option>
        <option value="0-1000">1,000円未満</option>
        <option value="1000-3000">1,000円〜3,000円</option>
        <option value="3000">3,000円以上</option>
      </select>
    </div>
  </div>

  <div class="product-grid" id="productGrid">
    <div th:each="p : ${products}" class="product-card" th:attr="data-id=${p.id},data-category=${p.category}">
      <div class="product-image" th:text="${p.image}">image</div>
      <div class="product-info">
        <span class="tag" th:text="${p.tag}">tag</span>
        <h3 th:text="${p.name}">name</h3>
        <p th:text="${p.description}">description</p>
        <div class="product-footer">
          <div class="price" th:text="${p.price + '円'}">0円</div>
          <a th:href="@{/products/{id}(id=${p.id})}" class="btn-detail">詳細を見る</a>
        </div>
      </div>
    </div>
  </div>

  <div class="no-results hidden" id="noResults">
    検索条件に該当する商品がありません。
  </div>
</div>

<footer class="footer">
  <p>Ave Blessings. 電子カードとお祝い動画の販売サイト。</p>
</footer>

<script th:src="@{/js/products.js}"></script>
</body>
</html>
