<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>すべての商品 - Ave Blessings</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="products.css" />
</head>
<body>

<header class="header">
  <div class="logo">Ave Blessings</div>
  <nav class="nav">
    <a href="index.html">ホーム</a>
    <a href="products.html">すべての商品</a>
    <a href="#">誕生日</a>
    <a href="#">結婚式</a>
    <a href="#">動画ギフト</a>
    <a href="cart.html">カート</a>
  </nav>
</header>

<div class="products-container">
  <div class="products-header">
    <h1>すべての商品</h1>
    <div class="filter-group">
      <input type="text" id="searchInput" placeholder="テンプレートを検索..." />
      <select id="categoryFilter">
        <option value="">すべてのカテゴリ</option>
        <option value="card">電子カード</option>
        <option value="invitation">招待状</option>
        <option value="video">動画ギフト</option>
      </select>
      <select id="priceFilter">
        <option value="">価格</option>
        <option value="0-1000">1,000円未満</option>
        <option value="1000-3000">1,000円〜3,000円</option>
        <option value="3000">3,000円以上</option>
      </select>
    </div>
  </div>

  <div class="product-grid" id="productGrid">
    <!-- 商品はJavaScriptで動的に生成されます -->
  </div>

  <div class="no-results hidden" id="noResults">
    検索条件に該当する商品がありません。
  </div>
</div>

<footer class="footer">
  <p>Ave Blessings. 電子カードとお祝い動画の販売サイト。</p>
</footer>

<script type="module" src="products.js"></script>
</body>
</html>
